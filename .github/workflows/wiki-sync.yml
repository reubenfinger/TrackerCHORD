name: Sync Docs to GitHub Wiki

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync docs/ to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git"
          if ! git ls-remote "$WIKI_URL" >/dev/null 2>&1; then
            echo "::notice::GitHub Wiki is not initialized yet. To enable Wiki sync, go to the 'Wiki' tab on GitHub and click 'Create the first page', then re-run this workflow."
            exit 0
          fi

          git clone "$WIKI_URL" wiki_repo
          rm -rf wiki_repo/*.md

          cp docs/*.md wiki_repo/
          cp CHANGELOG.md wiki_repo/CHANGELOG.md

          python3 - << 'EOF'
          import glob, os, re

          repo = os.environ["REPO"]
          branch = os.environ["BRANCH"]
          blob_base = f"https://github.com/{repo}/blob/{branch}/"

          for path in glob.glob("wiki_repo/*.md"):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              # Rewrite ../CHANGELOG.md to Wiki page CHANGELOG
              content = re.sub(r'\]\(\.\./CHANGELOG\.md\)', '](CHANGELOG)', content)

              # Rewrite docs/<page>.md links (e.g. from CHANGELOG.md) into Wiki page slugs
              content = re.sub(r'\]\(docs/([A-Za-z0-9_-]+)\.md(#[^)]+)?\)', lambda m: f']({m.group(1)}{m.group(2) or ""})', content)

              # Rewrite relative links to sibling docs/*.md pages into Wiki page slugs
              content = re.sub(r'\]\(([A-Za-z0-9_-]+)\.md(#[^)]+)?\)', lambda m: f']({m.group(1)}{m.group(2) or ""})', content)

              # Rewrite ../<repo-path> links to GitHub blob URLs
              content = re.sub(r'\]\(\.\./([^)]+)\)', lambda m: f']({blob_base}{m.group(1)})', content)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF

          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
          else
            git commit -m "Sync documentation from ${GITHUB_SHA::7}"
            git push origin HEAD
          fi
