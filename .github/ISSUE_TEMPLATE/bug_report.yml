name: Bug Report
description: Report a reproducible bug on Original Tracker, Tracker+, or Tracker Mini
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue in **Polyend Tracker CE**! Please fill out the details below so contributors can reproduce and fix it.

  - type: checkboxes
    id: devices
    attributes:
      label: Affected Device(s)
      description: On which hardware device(s) did you observe this bug?
      options:
        - label: Original Polyend Tracker (MK66)
        - label: Polyend Tracker+ (IMX)
        - label: Polyend Tracker Mini (IMX)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Firmware Version & Build
      description: Check **Config > Firmware** on your device (e.g. `CE 1.0.0`, Build `7f3a9c1`).
      placeholder: "CE 1.0.0 (Build 7f3a9c1)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happens vs. what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact step-by-step instructions to trigger the bug on hardware.
      value: |
        1. Go to '...'
        2. Press '...'
        3. Turn encoder / play pattern '...'
        4. Observe '...'
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context / Project or Sample Files
      description: Attach a minimal `.mt` project, `.pti` instrument, `.ptfx` plugin, or photo/video if helpful.
