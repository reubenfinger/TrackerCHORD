name: Feature Request
description: Propose a new feature, workflow enhancement, synth engine, or .ptfx effect
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for **Polyend Tracker CE**?
        > **Project Philosophy**: Our goal is to **preserve the spirit and immediate workflow of the original Tracker firmware while thoughtfully improving upon it** with features that benefit the community at large. If an idea deviates wildly from the core Tracker workflow or serves a very niche use case, consider whether it is better suited as a loadable `.ptfx` plugin or a custom fork. Or start a **[GitHub Discussion](https://github.com/polyend/tracker-ce/discussions)** or **[Polyend Backstage](https://backstage.polyend.com/) topic** first to gauge community consensus!

  - type: checkboxes
    id: target_devices
    attributes:
      label: Target Device(s)
      description: Which hardware device(s) would this feature apply to?
      options:
        - label: All Devices (Original Tracker, Tracker+, Tracker Mini)
        - label: Tracker+ & Tracker Mini only (IMX platform / Synth / Stereo)
        - label: Original Tracker only (MK66 platform)
        - label: Tracker Mini only
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Problem or Musical Goal
      description: What workflow limitation or musical use case does this feature solve?
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Proposed Behavior & UI / Controls
      description: How should the feature work on the screen and hardware controls (considering both Original/Plus pads/jogwheel and Tracker Mini buttons)?
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Technical Notes & Hardware Constraints (Optional)
      description: Any thoughts on RAM/Flash usage, project file compatibility, or implementation details?
